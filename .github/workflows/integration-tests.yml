name: Integration tests

# ParquetNeo against pyarrow (the Python bindings of Apache Arrow's Parquet, the reference implementation) and DuckDB (a second implementation, which
# also reads the bloom filters and the page index): files written by them are read by ParquetNeo, and files written by ParquetNeo are read by them,
# and each side must find what the other wrote.
# The same project has the tests of the storages of S3 and Azure Blob Storage against real servers (SeaweedFS and moto, two servers that speak the protocol of S3,
# and Azurite, the emulator of Azure Blob Storage): the unit tests of the storages use fakes of the SDKs, which only imitate how a server answers a request for a
# range, a listing in pages, a tag of version (If-Match) or an object that is not there; these ask a server.
# See tests/ParquetNeo.IntegrationTests.
#
# Which pyarrow:
#   - on a push to main: the version pinned in tests/ParquetNeo.IntegrationTests/python/requirements.txt, so that a release of pyarrow
#     does not make a push fail;
#   - every week (scheduled): the LATEST release, to see what a new pyarrow changes before anyone is surprised by it. A failure here is
#     news about a new pyarrow (or a difference ParquetNeo has with it): look at the log, then raise the pin once the tests pass;
#   - by hand: whatever is asked (see the input).

on:
  # Only on main (and by hand, from the Actions tab, for any branch): the suite needs Python and pyarrow, and is not part of the checks of a pull request.
  push:
    branches: [main]
  # The exception is a pull request that changes the storages or the tests of them: it runs the jobs of the servers (not the one of Python).
  pull_request:
    paths:
      - ".github/workflows/integration-tests.yml"
      - "tests/ParquetNeo.IntegrationTests/Storage/**"
      - "src/ParquetNeo.Storage.S3/**"
      - "src/ParquetNeo.Storage.AzureBlobs/**"
      - "src/ParquetNeo/Storage/**"
  schedule:
    # Mondays at 05:43 UTC. Scheduled workflows run on the default branch, and GitHub stops them after 60 days without activity in the repository.
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      pyarrow:
        description: "The pyarrow to test with ('pinned' is requirements.txt, 'latest' also takes the latest DuckDB, or a version of pyarrow such as 27.0.0)"
        type: string
        default: pinned

permissions:
  contents: read

jobs:
  python-interop:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Turns the tests on: with it a missing Python or pyarrow is a failure, not a skipped test.
      PARQUETNEO_PYTHON_TESTS: "1"
      # pinned, latest, or a version.
      PYARROW: ${{ github.event_name == 'schedule' && 'latest' || inputs.pyarrow || 'pinned' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json # the SDK to build with: 11
          dotnet-version: 10.0.x # and the runtime of .NET 10, which the tests of the net10.0 build run on

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/ParquetNeo.IntegrationTests/python/requirements.txt

      - name: Install pyarrow (${{ env.PYARROW }})
        shell: bash
        run: |
          case "$PYARROW" in
            pinned) python -m pip install -r tests/ParquetNeo.IntegrationTests/python/requirements.txt ;;
            latest) python -m pip install --upgrade pyarrow duckdb ;;
            *) python -m pip install "pyarrow==$PYARROW" "duckdb==$(grep -ioE '^duckdb==[0-9][^ #]*' tests/ParquetNeo.IntegrationTests/python/requirements.txt | cut -d= -f3)" ;;
          esac

      - name: Python and pyarrow
        run: |
          python --version
          python -c "import pyarrow, duckdb; print('pyarrow', pyarrow.__version__, 'duckdb', duckdb.__version__)"

      - name: Restore
        run: dotnet restore tests/ParquetNeo.IntegrationTests

      - name: Build
        run: dotnet build tests/ParquetNeo.IntegrationTests -c Release --no-restore

      - name: Integration tests
        env:
          PARQUETNEO_PYTHON: python
        run: dotnet test --project tests/ParquetNeo.IntegrationTests -c Release --no-build --results-directory TestResults

      - name: Summary
        if: always()
        shell: bash
        run: |
          pinned=$(grep -ioE '^pyarrow==[0-9][^ #]*' tests/ParquetNeo.IntegrationTests/python/requirements.txt | head -1 | cut -d= -f3)
          {
            echo "### Integration tests against pyarrow"
            echo "pyarrow $(python -c 'import pyarrow; print(pyarrow.__version__)'), duckdb $(python -c 'import duckdb; print(duckdb.__version__)') (asked for: \`$PYARROW\`; the pinned pyarrow is $pinned)"
          } >> "$GITHUB_STEP_SUMMARY"

  s3-seaweedfs:
    name: s3 (seaweedfs)
    runs-on: ubuntu-latest
    # The image starts a single node with S3 on 8333 by itself (its default command is "mini -dir=/data"), so GitHub starts it and removes it.
    # It has no credentials configured, so it takes any.
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        ports:
          - 9000:8333
    env:
      # The backends that must be there: with this a server that is missing or does not answer is a failure, not a skipped test.
      PARQUETNEO_EMULATOR_TESTS: s3
      PARQUETNEO_S3_ENDPOINT: http://127.0.0.1:9000
      PARQUETNEO_S3_ACCESS_KEY: test
      PARQUETNEO_S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:9000/; then echo "the server answers"; sleep 3; exit 0; fi
            sleep 1
          done
          echo "the server did not answer"
          exit 1

      - name: Build
        run: dotnet build tests/ParquetNeo.IntegrationTests -c Release

      - name: Tests
        run: dotnet test --project tests/ParquetNeo.IntegrationTests -c Release --no-build --results-directory TestResults

  s3-moto:
    name: s3 (moto)
    runs-on: ubuntu-latest
    # Moto answers as S3 does, and its image starts its server by itself, so GitHub starts it, waits for it and removes it.
    services:
      moto:
        image: motoserver/moto:5.2.5
        ports:
          - 9000:5000
    env:
      PARQUETNEO_EMULATOR_TESTS: s3
      PARQUETNEO_S3_ENDPOINT: http://127.0.0.1:9000
      PARQUETNEO_S3_ACCESS_KEY: test
      PARQUETNEO_S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:9000/; then echo "the server answers"; exit 0; fi
            sleep 1
          done
          echo "the server did not answer"
          exit 1

      - name: Build
        run: dotnet build tests/ParquetNeo.IntegrationTests -c Release

      - name: Tests
        run: dotnet test --project tests/ParquetNeo.IntegrationTests -c Release --no-build --results-directory TestResults

  azure:
    name: azure (azurite)
    runs-on: ubuntu-latest
    env:
      PARQUETNEO_EMULATOR_TESTS: azure
      # The account and the key of the emulator, which are the same for everyone.
      PARQUETNEO_AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # Not a service container: the version of the API the SDK asks for can be newer than the one the emulator knows, which takes --skipApiVersionCheck, a command.
      - name: Start Azurite
        run: |
          npm install --global azurite@3.38.0
          mkdir -p "$RUNNER_TEMP/azurite"
          nohup azurite-blob --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" --blobHost 127.0.0.1 > azurite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:10000/; then echo "azurite answers"; exit 0; fi
            sleep 1
          done
          echo "azurite did not answer"; tail -20 azurite.log
          exit 1

      - name: Build
        run: dotnet build tests/ParquetNeo.IntegrationTests -c Release

      - name: Tests
        run: dotnet test --project tests/ParquetNeo.IntegrationTests -c Release --no-build --results-directory TestResults
