name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json # the SDK to build with: 11
          dotnet-version: 10.0.x # and the runtime of .NET 10, which the tests of the net10.0 build run on

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura --results-directory TestResults

      - name: Native AOT smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for framework in net10.0 net11.0; do
            dotnet publish tests/ParquetNeo.AotSmoke -c Release -r linux-x64 -f "$framework" -o "aot-smoke/$framework"
            "./aot-smoke/$framework/ParquetNeo.AotSmoke"
          done

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          for f in TestResults/*.cobertura.xml; do
            [ -e "$f" ] || continue
            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$f" | head -1 | grep -o '[0-9.]*')
            echo "Line coverage (${{ matrix.os }}): $(awk "BEGIN { printf \"%.1f%%\", $rate * 100 }")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: TestResults/*.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/*.cobertura.xml
          if-no-files-found: warn

  packages:
    # The packages as a user gets them: built, packed and installed into a new Native AOT program.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version of the packages comes from the tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json # the SDK to build with: 11
          dotnet-version: 10.0.x # and the runtime of .NET 10, which the tests of the net10.0 build run on

      - name: Pack
        run: dotnet pack ParquetNeo.slnx -c Release -o packages

      - name: Install the packages in a new program
        run: |
          version=$(ls packages/ParquetNeo.All.*.nupkg | sed -E 's|.*/ParquetNeo\.All\.(.*)\.nupkg|\1|')
          build/verify-packages.sh packages "$version"

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*
          if-no-files-found: error
