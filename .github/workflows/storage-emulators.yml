name: Storage emulators

# The storages of S3 and of Azure Blob Storage against real servers: MinIO and moto (two servers that speak the protocol of S3) and Azurite (the emulator of
# Azure Blob Storage). The unit tests of the storages use fakes of the SDKs, which only imitate how a server answers a request for a range, a listing in pages,
# a tag of version (If-Match) or an object that is not there; these tests ask a server. See tests/ParquetNeo.Storage.EmulatorTests.

on:
  # On main, by hand, and on a pull request that changes what these tests are about.
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/storage-emulators.yml"
      - "tests/ParquetNeo.Storage.EmulatorTests/**"
      - "src/ParquetNeo.Storage.S3/**"
      - "src/ParquetNeo.Storage.AzureBlobs/**"
      - "src/ParquetNeo/Storage/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3:
    name: s3 (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [minio, moto]
    env:
      # The backends that must be there: with this a server that is missing or does not answer is a failure, not a skipped test.
      PARQUETNEO_EMULATOR_TESTS: s3
      PARQUETNEO_S3_ENDPOINT: http://127.0.0.1:9000
      PARQUETNEO_S3_ACCESS_KEY: minioadmin
      PARQUETNEO_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json # the SDK to build with: 11
          dotnet-version: 10.0.x # and the runtime of .NET 10, which the tests of the net10.0 build run on

      - name: Start MinIO
        if: matrix.server == 'minio'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data

      - uses: actions/setup-python@v6
        if: matrix.server == 'moto'
        with:
          python-version: "3.13"

      - name: Start moto
        if: matrix.server == 'moto'
        run: |
          python -m pip install "moto[server]==5.2.5"
          nohup moto_server --host 127.0.0.1 --port 9000 > moto.log 2>&1 &

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:9000/; then echo "the server answers"; exit 0; fi
            sleep 1
          done
          echo "the server did not answer"; docker logs minio 2>&1 | tail -20 || true; cat moto.log 2>/dev/null | tail -20 || true
          exit 1

      - name: Build
        run: dotnet build tests/ParquetNeo.Storage.EmulatorTests -c Release

      - name: Tests
        run: dotnet test --project tests/ParquetNeo.Storage.EmulatorTests -c Release --no-build --results-directory TestResults

  azure:
    name: azure (azurite)
    runs-on: ubuntu-latest
    env:
      PARQUETNEO_EMULATOR_TESTS: azure
      # The account and the key of the emulator, which are the same for everyone.
      PARQUETNEO_AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Start Azurite
        run: |
          npm install --global azurite@3.38.0
          mkdir -p "$RUNNER_TEMP/azurite"
          # The version of the API the SDK asks for can be newer than the one the emulator knows: the check of it is off.
          nohup azurite-blob --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" --blobHost 127.0.0.1 > azurite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null -m 2 http://127.0.0.1:10000/; then echo "azurite answers"; exit 0; fi
            sleep 1
          done
          echo "azurite did not answer"; cat azurite.log | tail -20
          exit 1

      - name: Build
        run: dotnet build tests/ParquetNeo.Storage.EmulatorTests -c Release

      - name: Tests
        run: dotnet test --project tests/ParquetNeo.Storage.EmulatorTests -c Release --no-build --results-directory TestResults
