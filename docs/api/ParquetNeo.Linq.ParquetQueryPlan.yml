  summary: What a query reads of a dataset, from the footers of its files; see <xref href="ParquetNeo.Linq.ParquetQueryableExtensions.Explain%60%601(System.Linq.IQueryable%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public ParquetQueryPlan(int Files, int FilesSkipped, int RowGroups, int RowGroupsSkipped, string? Filter, IReadOnlyList<string>? Columns, bool AnsweredFromMetadata)
    parameters:
    - id: Files
      type: System.Int32
      description: The number of files in the dataset.
    - id: FilesSkipped
      type: System.Int32
      description: How many of them are not read at all, because their statistics rule out every row of them.
    - id: RowGroups
      type: System.Int32
      description: The number of row groups in the files that are opened.
    - id: RowGroupsSkipped
      type: System.Int32
      description: How many of those are not read, for the same reason.
    - id: Filter
      type: System.String
      description: The condition that was taken from the query to check against the statistics, or null when none could be.
    - id: Columns
      type: System.Collections.Generic.IReadOnlyList{System.String}
      description: The columns that are read, or null when all that the row type has are.
    - id: AnsweredFromMetadata
      type: System.Boolean
      description: Whether the query is answered from the footers alone, with no data read (the number of rows of a dataset, or whether it has any).
    content.vb: Public Sub New(Files As Integer, FilesSkipped As Integer, RowGroups As Integer, RowGroupsSkipped As Integer, Filter As String, Columns As IReadOnlyList(Of String), AnsweredFromMetadata As Boolean)
