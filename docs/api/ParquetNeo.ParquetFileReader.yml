  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    The positions of the row groups that can hold a row that satisfies a filter, in order: the others are skipped because the

    statistics of their columns show that no row does. See <xref href="ParquetNeo.ParquetFilter" data-throw-if-not-resolved="false"></xref> for what that means for the rows of the

    row groups that are kept.
