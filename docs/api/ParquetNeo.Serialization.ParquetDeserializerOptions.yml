  nameWithType: ParquetDeserializerOptions.RowGroupFilter
  fullName: ParquetNeo.Serialization.ParquetDeserializerOptions.RowGroupFilter
  type: Property
  source:
    remote:
      path: src/ParquetNeo.Serialization/ParquetDeserializerOptions.cs
      branch: docfx
      repo: https://github.com/gigi81/parquet-neo
    id: RowGroupFilter
    path: ../src/ParquetNeo.Serialization/ParquetDeserializerOptions.cs
    startLine: 20
  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.Serialization
  summary: >-
    A condition that row groups are checked against by the statistics of their columns, to skip those that cannot hold a row that

    satisfies it: they are not read (with the asynchronous methods, their bytes are not fetched either). It only prunes: the rows

    of the row groups that are read are all returned, whether they satisfy the condition or not, so filter them as well when the

    result must hold exactly. All the row groups are read when it is not set.
  remarks: >-
    The synchronous methods look further: equality conditions are also checked against the bloom filters of the columns, and the

    pages of the row groups that are read against the page index, when the file has them; the rows of the pages that cannot hold a

    row that satisfies the condition are not returned either. The asynchronous methods fetch only the byte ranges of the footer and

    of the columns they read, and check the statistics.
  example: []
  syntax:
    content: public ParquetFilter? RowGroupFilter { get; init; }
    parameters: []
    return:
      type: ParquetNeo.ParquetFilter
    content.vb: Public Property RowGroupFilter As ParquetFilter
  overload: ParquetNeo.Serialization.ParquetDeserializerOptions.RowGroupFilter*
