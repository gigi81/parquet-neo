  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.Serialization.Generated
  summary: >-
    Describes how a row type is read from columns, and gets the code that creates each object from their values. What the source

    generator writes for a type uses it, and nothing at run time looks at the type: no reflection, and no code is compiled. Not for use in

    code you write yourself.
  remarks: >-
    The properties are described in the same way as for a <xref href="ParquetNeo.Serialization.Generated.WriteMappingBuilder%601" data-throw-if-not-resolved="false"></xref>: in the order of their columns,

    depth first, with a Begin call and <xref href="ParquetNeo.Serialization.Generated.ReadMappingBuilder%601.End" data-throw-if-not-resolved="false"></xref> around what is inside an object, a collection or a dictionary.
