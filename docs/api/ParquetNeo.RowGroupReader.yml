  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Opens a column to read only the rows of <code class="paramref">selection</code>: the pages that hold none of them are not read, and what

    is read is those rows one after the other, as if the others were not there. Needs the offset index of the column.
  example: []
  syntax:
    content: public ColumnReader OpenColumn(int index, RowSelection selection)
    parameters:
    - id: index
      type: System.Int32
    - id: selection
      type: ParquetNeo.RowSelection
    return:
      type: ParquetNeo.ColumnReader
    content.vb: Public Function OpenColumn(index As Integer, selection As RowSelection) As ColumnReader
  overload: ParquetNeo.RowGroupReader.OpenColumn*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: The file has no usable offset index for the column, or the selection has rows past the end of the group.
  nameWithType.vb: RowGroupReader.OpenColumn(Integer, RowSelection)
  fullName.vb: ParquetNeo.RowGroupReader.OpenColumn(Integer, ParquetNeo.RowSelection)
  name.vb: OpenColumn(Integer, RowSelection)
