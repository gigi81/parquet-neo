    id: SelectRows
    path: ../src/ParquetNeo/RowGroupReader.cs
    startLine: 81
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    The rows of this group that the filter may match by the page index of its columns, to be given to <xref href="ParquetNeo.RowGroupReader.OpenColumn(System.Int32%2cParquetNeo.RowSelection)" data-throw-if-not-resolved="false"></xref>

    for each of <code class="paramref">columns</code>; <code>null</code> when there is nothing to gain: the filter cannot rule out a page, or one of

    the columns has no offset index. The rows of the pages kept that do not satisfy the filter are in it, so check them as well when

    the result must hold exactly.
  example: []
  syntax:
    content: public RowSelection? SelectRows(ParquetFilter filter, IEnumerable<int> columns)
    parameters:
    - id: filter
      type: ParquetNeo.ParquetFilter
    - id: columns
      type: System.Collections.Generic.IEnumerable{System.Int32}
      description: The positions in the schema of the columns that are going to be read.
    return:
      type: ParquetNeo.RowSelection
    content.vb: Public Function SelectRows(filter As ParquetFilter, columns As IEnumerable(Of Integer)) As RowSelection
