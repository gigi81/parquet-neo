    id: ColumnWriter
    path: ../src/ParquetNeo/ColumnWriter.LogicalTypes.cs
    startLine: 10
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Writes the values of one column of a row group. Obtain it from <xref href="ParquetNeo.RowGroupWriter.NextColumn" data-throw-if-not-resolved="false"></xref>, call

    one of the <code>Write…</code> methods one or more times, then move on to the next column.
  remarks: >-
    <p>

    For a required column pass only the values. For an optional column also pass one definition level per row:

    <code>0</code> for a null and <code>1</code> for a value, with <code>values</code> holding just the non-null values in order.

    </p>

    <p>

    A nested column (a leaf below optional or repeated groups) has a definition level per entry that counts how many

    of its optional and repeated ancestors, and itself, are present, up to <xref href="ParquetNeo.Schema.SchemaNode.MaxDefinitionLevel" data-throw-if-not-resolved="false"></xref>:

    only entries at that level carry a value. A column inside a repeated group also takes a repetition level per entry,

    which says at which repeated ancestor the entry repeats: <code>0</code> starts a new row, and a higher level continues the

    row at that depth. Entries are the unit of a batch; a row can span several entries and even several batches (it ends

    where the next entry with repetition level <code>0</code> begins), and the first entry of a column must start a row.

    Pages never end in the middle of a row. The levels are checked against their ranges but not against the schema's

    structure: levels that no row could produce give a file readers will reject.

    </p>

    <p>Values are buffered into pages of about <xref href="ParquetNeo.ParquetWriterOptions.DataPageSize" data-throw-if-not-resolved="false"></xref> bytes, which are

    compressed and written to the stream as they fill. Instances are not thread safe.</p>
