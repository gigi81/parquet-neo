  namespace: ParquetNeo.Serialization.Generated
  summary: >-
    Describes how a row type is written as columns, and gets the code that gives the values of each object to them. What the source

    generator writes for a type uses it, and nothing at run time looks at the type: no reflection, and no code is compiled. Not for use in

    code you write yourself.
  remarks: >-
    The properties are described in the order of their columns, depth first: <xref href="ParquetNeo.Serialization.Generated.WriteMappingBuilder%601.Leaf%60%601(System.String%2cSystem.String%2cSystem.Boolean%2cParquetNeo.ColumnTypes.ColumnSettings%2cSystem.Nullable%7bParquetNeo.ParquetEncoding%7d%2cParquetNeo.DictionarySettings)" data-throw-if-not-resolved="false"></xref> for one that is a column of its

    own, and for an object, a collection or a dictionary a Begin call, what is inside it, and <xref href="ParquetNeo.Serialization.Generated.WriteMappingBuilder%601.End" data-throw-if-not-resolved="false"></xref>. In a collection the

    element is described, and in a dictionary the key and then the value; they have no names.
