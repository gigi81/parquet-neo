    id: ParquetFilter
    path: ../src/ParquetNeo/ParquetFilter.cs
    startLine: 25
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    A condition on the values of columns, which a reader checks against the statistics of each row group (the smallest and largest

    value, and how many are null) to skip the row groups that cannot hold a row that satisfies it. Build one with

    <xref href="ParquetNeo.ParquetFilter.Column(System.String%5b%5d)" data-throw-if-not-resolved="false"></xref> and combine with <xref href="ParquetNeo.ParquetFilter.And(ParquetNeo.ParquetFilter)" data-throw-if-not-resolved="false"></xref>, <xref href="ParquetNeo.ParquetFilter.Or(ParquetNeo.ParquetFilter)" data-throw-if-not-resolved="false"></xref> and <xref href="ParquetNeo.ParquetFilter.Not" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    A filter only prunes: a row group is skipped when its statistics prove that no row satisfies the filter, and kept when they say

    that one may or cannot tell (no statistics, a column of the file the filter names but the file does not have, a column in a

    collection). The rows of a kept row group are not filtered, so apply the condition to them as well when it must hold exactly.

    </p>

    <p>

    A comparison with a null is false, and <xref href="ParquetNeo.ParquetFilter.Not" data-throw-if-not-resolved="false"></xref> negates, so <code>Not(Equal(5))</code> is true for a null, as

    <code>x != 5</code> is in C#. Values are compared as the column type defines: numbers, dates, times and decimals by value, text and

    binary by their bytes (UTF-8 for text). Enums (stored by name) and <xref href="System.Guid" data-throw-if-not-resolved="false"></xref>s can only be compared for equality;

    a comparison for order with them keeps every row group.

    </p>
  example: []
