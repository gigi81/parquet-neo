  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Compression
  summary: >-
    Decompresses <code class="paramref">source</code> into <code class="paramref">destination</code>, whose length must be exactly

    the uncompressed size recorded in the page header.
  example: []
  syntax:
    content: void Decompress(ReadOnlySpan<byte> source, Span<byte> destination)
    parameters:
    - id: source
      type: System.ReadOnlySpan{System.Byte}
    - id: destination
      type: System.Span{System.Byte}
    content.vb: Sub Decompress(source As ReadOnlySpan(Of Byte), destination As Span(Of Byte))
  overload: ParquetNeo.Compression.ICodec.Decompress*
  exceptions:
  - type: ParquetNeo.Exceptions.CompressionException
    commentId: T:ParquetNeo.Exceptions.CompressionException
    description: The data is corrupt, or does not decompress to exactly <code>destination.Length</code> bytes.
