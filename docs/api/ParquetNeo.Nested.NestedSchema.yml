  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Nested
  summary: >-
    Finds the parts of the list that <code class="paramref">node</code> is, or returns null when it is not a list. A node is a list

    when it is a group annotated LIST with the shape of one of the <xref href="ParquetNeo.ListStyle" data-throw-if-not-resolved="false"></xref> layouts, or a repeated field

    (which is a list of required elements; pass the LIST group rather than the repeated node inside it).
  example: []
  syntax:
    content: public static ListLayout? GetListLayout(SchemaNode node)
    parameters:
    - id: node
      type: ParquetNeo.Schema.SchemaNode
    return:
      type: ParquetNeo.Nested.ListLayout
    content.vb: Public Shared Function GetListLayout(node As SchemaNode) As ListLayout
