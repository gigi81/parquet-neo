    id: CountEntriesInCompleteRows
    path: ../src/ParquetNeo/Nested/ColumnStructure.cs
    startLine: 204
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Nested
  summary: Returns the number of leading entries of a batch of repetition levels that belong to rows known to be complete.
  remarks: >-
    A batch of a repeated column can end in the middle of a row. The entries from the last one with repetition level 0

    on may be the start of a row that goes on in the next batch, so assemble only the entries before them and carry the

    rest over. At the end of the column the whole batch is complete.
  example: []
  syntax:
    content: public static int CountEntriesInCompleteRows(ReadOnlySpan<int> repetitionLevels)
    parameters:
    - id: repetitionLevels
      type: System.ReadOnlySpan{System.Int32}
    return:
      type: System.Int32
    content.vb: Public Shared Function CountEntriesInCompleteRows(repetitionLevels As ReadOnlySpan(Of Integer)) As Integer
