    path: ../src/ParquetNeo/Nested/ColumnStructure.cs
    startLine: 22
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Nested
  summary: >-
    The shape of the data in one column, as validity and offsets instead of definition and repetition levels: for each

    optional node on the way to the column whether its value is present, and for each repeated node where each list

    starts and ends. It is the columnar form of nested data (the same idea as the validity and offsets of an Arrow

    array), and it converts both ways with the levels the reader returns and the writer takes.
  remarks: >-
    <p>

    Only the nodes that can be missing or repeated take part; required nodes add nothing. The <xref href="ParquetNeo.Nested.ColumnStructure.Levels" data-throw-if-not-resolved="false"></xref> come

    outermost first. Every level has one entry per <i>item</i> of its depth: depth 0 has one item per row, and the items

    of depth <code>d</code> are the elements of the <code>d</code>-th repeated level. Where an ancestor is missing, the entries of the

    optional levels below it (at the same depth) say <code>false</code> and a repeated level below it says an empty list.

    </p>

    <p>

    The values of the column are not part of the structure: they are the values of the entries whose every ancestor is

    present, in order, which is exactly what <xref href="ParquetNeo.ColumnWriter" data-throw-if-not-resolved="false"></xref> takes and <xref href="ParquetNeo.ColumnReader" data-throw-if-not-resolved="false"></xref> returns.

    </p>
  example: []
