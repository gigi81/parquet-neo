    path: ../src/ParquetNeo/Data/ParquetDataReader.cs
    startLine: 32
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Data
  summary: >-
    Reads a Parquet file as a <xref href="System.Data.Common.DbDataReader" data-throw-if-not-resolved="false"></xref>, so that it can go wherever a query result can: <code>SqlBulkCopy</code>,

    <xref href="System.Data.DataTable.Load(System.Data.IDataReader)" data-throw-if-not-resolved="false"></xref>, Dapper and the like.
  remarks: >-
    <p>

    The columns are the top-level columns that hold a single value per row (not lists, maps or nested objects), or the ones named

    in <xref href="ParquetNeo.Data.ParquetDataReaderOptions.Columns" data-throw-if-not-resolved="false"></xref>. Each is given as the .NET type its logical type stands for:

    <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> and <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> for plain integers, <xref href="System.SByte" data-throw-if-not-resolved="false"></xref> to <xref href="System.UInt64" data-throw-if-not-resolved="false"></xref> for the annotated

    ones, <xref href="System.String" data-throw-if-not-resolved="false"></xref> for text, <xref href="System.Byte" data-throw-if-not-resolved="false"></xref> arrays for binary, <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref>, <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref>

    (UTC when the column is adjusted to UTC), <xref href="System.DateOnly" data-throw-if-not-resolved="false"></xref>, <xref href="System.TimeOnly" data-throw-if-not-resolved="false"></xref>, <xref href="System.Guid" data-throw-if-not-resolved="false"></xref>, <xref href="System.Half" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Single" data-throw-if-not-resolved="false"></xref>, <xref href="System.Double" data-throw-if-not-resolved="false"></xref> and <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref>. Binary columns, including an unannotated

    FIXED_LEN_BYTE_ARRAY, are <xref href="System.Byte" data-throw-if-not-resolved="false"></xref> arrays. A column that no .NET type fits, such as an INTERVAL, is a

    <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref> unless it is left out with <xref href="ParquetNeo.Data.ParquetDataReaderOptions.Columns" data-throw-if-not-resolved="false"></xref>.

    A null is <xref href="System.DBNull" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    A row group is read into memory, column by column, when the reader reaches it, and rows are then given from memory, so a

    reader holds one row group at a time. The typed getters (<xref href="ParquetNeo.Data.ParquetDataReader.GetInt32(System.Int32)" data-throw-if-not-resolved="false"></xref> and so on) throw an

    <xref href="System.InvalidCastException" data-throw-if-not-resolved="false"></xref> when the column is of another type or the value is null.

    </p>
