  namespace: ParquetNeo
  summary: >-
    Writes one row group: every column of the schema, in schema order, each with the same number of rows.

    Create it with <xref href="ParquetNeo.ParquetFileWriter.AppendRowGroup" data-throw-if-not-resolved="false"></xref>, call <xref href="ParquetNeo.RowGroupWriter.NextColumn" data-throw-if-not-resolved="false"></xref> once per column,

    and dispose it (or call <xref href="ParquetNeo.RowGroupWriter.Close" data-throw-if-not-resolved="false"></xref>) to finish the group.
