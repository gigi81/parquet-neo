    id: WriteColumns
    path: ../src/ParquetNeo/RowGroupWriter.cs
    startLine: 92
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Writes every column of the group, encoding up to <code class="paramref">maxDegreeOfParallelism</code> of them at a time. Encoding

    (the dictionary, the levels, compression, statistics) is most of the time of writing, so a group of several columns takes

    about as long as its slowest column instead of the sum of them.
  remarks: >-
    <p>

    The columns are encoded into buffers of their own, and then copied to the file in the order of the schema, so the file is

    the same, byte for byte, as the one <xref href="ParquetNeo.RowGroupWriter.NextColumn" data-throw-if-not-resolved="false"></xref> makes whatever the degree of parallelism. The group must not

    have started: this does all of its columns.

    </p>

    <p>

    The actions run on different threads, one thread for each action, so they must not share anything that is not safe to share

    (the arrays they read from are fine as long as nothing writes to them). The <xref href="ParquetNeo.ColumnWriter" data-throw-if-not-resolved="false"></xref> an action gets is for

    that action alone and only until it returns: write the values of the column to it and do not keep it. The action does not

    complete the column; the group does.

    </p>

    <p>

    The encoded columns of the group are held in memory until all of them are done, so this takes about the size of the group

    (compressed) more memory than <xref href="ParquetNeo.RowGroupWriter.NextColumn" data-throw-if-not-resolved="false"></xref>, which writes each column to the file as it goes. If an action throws,

    that exception is thrown from here, nothing of the group is written, and disposing the group abandons the file. Use

    <xref href="ParquetNeo.RowGroupWriter.NextColumn" data-throw-if-not-resolved="false"></xref> for a group that is too big to hold, or for a single column.

    </p>
  example: []
  syntax:
    content: public void WriteColumns(IReadOnlyList<Action<ColumnWriter>> columns, int maxDegreeOfParallelism, CancellationToken cancellationToken = default)
    parameters:
    - id: columns
      type: System.Collections.Generic.IReadOnlyList{System.Action{ParquetNeo.ColumnWriter}}
      description: What to write to each column, in the order of the schema.
    - id: maxDegreeOfParallelism
      type: System.Int32
      description: The most columns encoded at the same time; at least 1.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Stops the columns that have not started; the exception is an <xref href="System.OperationCanceledException" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Sub WriteColumns(columns As IReadOnlyList(Of Action(Of ColumnWriter)), maxDegreeOfParallelism As Integer, cancellationToken As CancellationToken = Nothing)
  overload: ParquetNeo.RowGroupWriter.WriteColumns*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">columns</code> is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: An action is null.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: <code class="paramref">maxDegreeOfParallelism</code> is below 1.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A column has been started already, there is not one action per column, or the columns have different row counts.
