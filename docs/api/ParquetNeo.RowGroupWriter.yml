    id: Dispose
    path: ../src/ParquetNeo/RowGroupWriter.cs
    startLine: 212
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Finishes the group if every column was written. Problems (a missing column, a column without values,

    mismatched row counts) are not reported from here, so that disposing never hides an exception that is

    already on its way: the file is abandoned instead and <xref href="ParquetNeo.ParquetFileWriter.Close" data-throw-if-not-resolved="false"></xref> then fails.

    Call <xref href="ParquetNeo.RowGroupWriter.Close" data-throw-if-not-resolved="false"></xref> to get the error at the point where it happens.
  example: []
  syntax:
    content: public void Dispose()
    content.vb: Public Sub Dispose()
  overload: ParquetNeo.RowGroupWriter.Dispose*
  implements:
  - System.IDisposable.Dispose
