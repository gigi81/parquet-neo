  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.Serialization
  summary: >-
    Writes objects as rows of a Parquet file (<xref href="ParquetNeo.Serialization.ParquetSerializer.Serialize%60%601(System.Collections.Generic.IEnumerable%7b%60%600%7d%2cSystem.IO.Stream%2cParquetNeo.Serialization.ParquetSerializerOptions)" data-throw-if-not-resolved="false"></xref> and <xref href="ParquetNeo.Serialization.ParquetSerializer.SerializeAsync%60%601(System.Collections.Generic.IEnumerable%7b%60%600%7d%2cSystem.IO.Stream%2cParquetNeo.Serialization.ParquetSerializerOptions%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>),

    and reads rows back (<xref href="ParquetNeo.Serialization.ParquetSerializer.Deserialize%60%601(System.IO.Stream%2cParquetNeo.Serialization.ParquetDeserializerOptions)" data-throw-if-not-resolved="false"></xref>, <xref href="ParquetNeo.Serialization.ParquetSerializer.DeserializeAll%60%601(System.IO.Stream%2cParquetNeo.Serialization.ParquetDeserializerOptions)" data-throw-if-not-resolved="false"></xref> and their asynchronous forms; see

    the remarks below for what reading supports). Each public property becomes a column, named after the property and typed by

    the convention below, which attributes on the property adjust: <xref href="ParquetNeo.DataModel.ParquetColumnAttribute" data-throw-if-not-resolved="false"></xref>,

    <xref href="ParquetNeo.DataModel.ParquetIgnoreAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="ParquetNeo.DataModel.ParquetDecimalAttribute" data-throw-if-not-resolved="false"></xref>, <xref href="ParquetNeo.DataModel.ParquetTimestampAttribute" data-throw-if-not-resolved="false"></xref>,

    <xref href="ParquetNeo.DataModel.ParquetTimeAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="ParquetNeo.DataModel.ParquetEncodingAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    A column is optional (it can hold nulls) when the property is a <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref>, or a reference type that is

    not declared non-nullable (nullable reference types decide, including for the elements of collections and the values of

    dictionaries). Writing a null where the column is required is an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> that names the property

    and the row.

    </p>

    <p>

    Supported types: <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref>, the integers of every width, <xref href="System.Single" data-throw-if-not-resolved="false"></xref>, <xref href="System.Double" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Half" data-throw-if-not-resolved="false"></xref>, <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> (precision 38 and scale 18 unless set), <xref href="System.String" data-throw-if-not-resolved="false"></xref>, <xref href="System.Byte" data-throw-if-not-resolved="false"></xref>

    arrays, <xref href="System.Guid" data-throw-if-not-resolved="false"></xref>, <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> and <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> (UTC microseconds unless set),

    <xref href="System.DateOnly" data-throw-if-not-resolved="false"></xref> and <xref href="System.TimeOnly" data-throw-if-not-resolved="false"></xref> (microseconds unless set), and enums (written by name, annotated ENUM).

    Beyond those:

    </p>

    <ul><li>an object (a class, record or struct with public properties) is a group of the columns of its own properties;</li><li>an array, a <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref> or anything that is <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> is a LIST of its elements, which can be

    any of these types, including collections and objects;</li><li>a <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref> or any <xref href="System.Collections.Generic.IDictionary%602" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.Generic.IReadOnlyDictionary%602" data-throw-if-not-resolved="false"></xref>

    is a MAP; its keys are never null.</li></ul>

    <p>

    The attributes of a property that is a collection or dictionary apply to what it holds: <xref href="ParquetNeo.DataModel.ParquetDecimalAttribute" data-throw-if-not-resolved="false"></xref>

    to its decimals, <xref href="ParquetNeo.DataModel.ParquetEncodingAttribute" data-throw-if-not-resolved="false"></xref> to all its columns. Types that merely implement a few interfaces

    are guessed at only when their elements are clear; a type that contains itself, <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> and the other

    types of the .NET libraries, multi-dimensional arrays and collections that are structs are a

    <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref> that names the property.

    </p>

    <p>

    Reading takes the columns of a file by the names of the properties (or of <xref href="ParquetNeo.DataModel.ParquetColumnAttribute" data-throw-if-not-resolved="false"></xref>; a name that

    differs only by case also fits when there is just one such column) and reads nothing else, so a row type can be a projection

    of a wider file. A column the file lacks leaves a property that can hold null at null; for any other property it is a

    <xref href="ParquetNeo.Exceptions.SchemaMismatchException" data-throw-if-not-resolved="false"></xref>, as is a column stored as a type the property cannot hold. A type with a

    constructor that takes nothing is created and its properties with a public setter (including init-only) are set; otherwise

    a public constructor whose parameters are properties is used, as for a record. The same goes for nested objects, and

    collections are created as the property asks (an array, a <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref>, a <xref href="System.Collections.Generic.HashSet%601" data-throw-if-not-resolved="false"></xref>, or any

    type that has a public constructor without parameters and is an <xref href="System.Collections.Generic.ICollection%601" data-throw-if-not-resolved="false"></xref>; an interface they implement

    gets a list or a set) and so are dictionaries (a <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref> or any type that is an

    <xref href="System.Collections.Generic.IDictionary%602" data-throw-if-not-resolved="false"></xref> with such a constructor). The standard LIST and MAP layouts and the older layouts

    of lists are read.

    </p>

    <p>

    The rows go into row groups of <xref href="ParquetNeo.Serialization.ParquetSerializerOptions.RowGroupSize" data-throw-if-not-resolved="false"></xref> rows, each encoded and written to the

    stream when it is full. The stream is not closed, and holds a partial file if serializing fails.

    </p>
