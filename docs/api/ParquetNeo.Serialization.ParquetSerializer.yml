  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.Serialization
  summary: Reads the rows of a Parquet file as they are asked for, one row group at a time.
  remarks: >-
    The columns of a row group that the row type needs are read into memory when the first of its rows is asked for, so the

    memory is that of a row group, not of the file. The file is opened, and the rows can fail to match its schema, when the

    first row is asked for. Columns of the file that the row type has no property for are never read.
  example: []
  syntax:
    content: public static IEnumerable<TRow> DeserializeAll<TRow>(Stream source, ParquetDeserializerOptions? options = null)
    parameters:
    - id: source
      type: System.IO.Stream
      description: A readable, seekable stream holding the whole file. It is not closed.
    - id: options
      type: ParquetNeo.Serialization.ParquetDeserializerOptions
    typeParameters:
    - id: TRow
    return:
      type: System.Collections.Generic.IEnumerable{{TRow}}
