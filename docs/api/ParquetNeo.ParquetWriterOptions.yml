- uid: ParquetNeo.ParquetWriterOptions.ColumnEncodings
  commentId: P:ParquetNeo.ParquetWriterOptions.ColumnEncodings
  id: ColumnEncodings
  parent: ParquetNeo.ParquetWriterOptions
  langs:
  - csharp
  - vb
  name: ColumnEncodings
  nameWithType: ParquetWriterOptions.ColumnEncodings
  fullName: ParquetNeo.ParquetWriterOptions.ColumnEncodings
  type: Property
  source:
    remote:
      path: src/ParquetNeo/ParquetWriterOptions.cs
      branch: docfx
      repo: https://github.com/gigi81/parquet-neo
    id: ColumnEncodings
    path: ../src/ParquetNeo/ParquetWriterOptions.cs
    startLine: 93
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    The encoding to use for the values of chosen columns, keyed by column path with dots (<code>scores.list.element</code>).

    The default is PLAIN. A column chosen here uses its encoding for every page that is not dictionary encoded: all of

    them when <xref href="ParquetNeo.ParquetWriterOptions.DictionaryEnabled" data-throw-if-not-resolved="false"></xref> is off, otherwise the pages after the dictionary is given up.

    DELTA_BINARY_PACKED suits integers that change steadily, DELTA_LENGTH_BYTE_ARRAY and DELTA_BYTE_ARRAY strings

    (the latter when they share prefixes), and BYTE_STREAM_SPLIT floating-point numbers before compression.
  example: []
  syntax:
    content: public IReadOnlyDictionary<string, ParquetEncoding>? ColumnEncodings { get; init; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,ParquetNeo.ParquetEncoding}
    content.vb: Public Property ColumnEncodings As IReadOnlyDictionary(Of String, ParquetEncoding)
  overload: ParquetNeo.ParquetWriterOptions.ColumnEncodings*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: 'Reported when the writer is created: a column that does not exist, or an encoding its type cannot use.'
