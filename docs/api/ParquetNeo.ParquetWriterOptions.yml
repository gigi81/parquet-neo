- uid: ParquetNeo.ParquetWriterOptions.DictionaryEnabled
  commentId: P:ParquetNeo.ParquetWriterOptions.DictionaryEnabled
  id: DictionaryEnabled
  parent: ParquetNeo.ParquetWriterOptions
  langs:
  - csharp
