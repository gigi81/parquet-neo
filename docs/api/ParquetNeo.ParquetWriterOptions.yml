    id: DictionaryEnabled
    path: ../src/ParquetNeo/ParquetWriterOptions.cs
    startLine: 28
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Whether columns are dictionary encoded: each distinct value is stored once and the rows refer to it by number,

    which is far smaller for repetitive data. A column falls back to plain encoding once its dictionary grows past

    <xref href="ParquetNeo.ParquetWriterOptions.DictionaryPageSizeLimit" data-throw-if-not-resolved="false"></xref>. Booleans are never dictionary encoded. Defaults to <code>true</code>.
  example: []
  syntax:
    content: public bool DictionaryEnabled { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property DictionaryEnabled As Boolean
  overload: ParquetNeo.ParquetWriterOptions.DictionaryEnabled*
