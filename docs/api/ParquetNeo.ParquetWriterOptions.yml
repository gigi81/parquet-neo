    id: WritePageChecksums
    path: ../src/ParquetNeo/ParquetWriterOptions.cs
    startLine: 57
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Whether the header of every page carries the CRC-32 of the page as it is written (after compression), so that a reader can

    tell that the bytes were damaged. Computing it costs about 1 second per GB of page bytes: noticeable (tens of percent) when

    writing uncompressed pages, negligible next to a compression codec. Off by default.
  example: []
  syntax:
    content: public bool WritePageChecksums { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property WritePageChecksums As Boolean
  overload: ParquetNeo.ParquetWriterOptions.WritePageChecksums*
- uid: ParquetNeo.ParquetWriterOptions.WritePageIndex
  commentId: P:ParquetNeo.ParquetWriterOptions.WritePageIndex
  id: WritePageIndex
  parent: ParquetNeo.ParquetWriterOptions
  langs:
  - csharp
  - vb
  name: WritePageIndex
  nameWithType: ParquetWriterOptions.WritePageIndex
  fullName: ParquetNeo.ParquetWriterOptions.WritePageIndex
  type: Property
  source:
    remote:
      path: src/ParquetNeo/ParquetWriterOptions.cs
      branch: docfx
      repo: https://github.com/gigi81/parquet-neo
    id: WritePageIndex
    path: ../src/ParquetNeo/ParquetWriterOptions.cs
    startLine: 66
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Whether the file gets a page index: for every column, where each data page is and the smallest and largest value in it, written

    after the row groups. A reader that is given a condition can then skip the pages that cannot hold a row that satisfies it, not only

    the row groups, which pays off in row groups of many pages whose values are in some order (a time, an id that grows). The index

    takes a few bytes a page and the bounds cost a little time to collect. Needs <xref href="ParquetNeo.ParquetWriterOptions.StatisticsEnabled" data-throw-if-not-resolved="false"></xref> for the bounds; without

    it only the positions of the pages are written. Off by default.
  example: []
  syntax:
    content: public bool WritePageIndex { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property WritePageIndex As Boolean
  overload: ParquetNeo.ParquetWriterOptions.WritePageIndex*
- uid: ParquetNeo.ParquetWriterOptions.ColumnBloomFilters
  commentId: P:ParquetNeo.ParquetWriterOptions.ColumnBloomFilters
  id: ColumnBloomFilters
  parent: ParquetNeo.ParquetWriterOptions
  langs:
  - csharp
  - vb
  name: ColumnBloomFilters
  nameWithType: ParquetWriterOptions.ColumnBloomFilters
  fullName: ParquetNeo.ParquetWriterOptions.ColumnBloomFilters
  type: Property
  source:
    remote:
      path: src/ParquetNeo/ParquetWriterOptions.cs
      branch: docfx
      repo: https://github.com/gigi81/parquet-neo
    id: ColumnBloomFilters
    path: ../src/ParquetNeo/ParquetWriterOptions.cs
    startLine: 77
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    The columns that get a bloom filter in every row group, keyed by column path with dots (<code>address.city</code>). A bloom

    filter tells a reader that a value is certainly not in a row group (it is wrong the other way a small share of the time, see

    <xref href="ParquetNeo.BloomFilterSettings.FalsePositiveRate" data-throw-if-not-resolved="false"></xref>), which the minimum and the maximum cannot when the values are spread

    widely, as ids and names are. Each takes room in the file, about a byte for every few different values. Hashing and counting

    the values makes writing the column several times slower when the pages are not compressed, and little slower when they are.

    Booleans and INT96 cannot have one.
  example: []
  syntax:
    content: public IReadOnlyDictionary<string, BloomFilterSettings>? ColumnBloomFilters { get; init; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,ParquetNeo.BloomFilterSettings}
    content.vb: Public Property ColumnBloomFilters As IReadOnlyDictionary(Of String, BloomFilterSettings)
  overload: ParquetNeo.ParquetWriterOptions.ColumnBloomFilters*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: 'Reported when the writer is created: a column that does not exist or cannot have a filter, or settings that make no sense.'
