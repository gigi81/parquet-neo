  assemblies:
  - ParquetNeo.Enums
  namespace: ParquetNeo
  summary: >-
    Every distinct value goes into a dictionary until the dictionary passes <code>ParquetWriterOptions.DictionaryPageSizeLimit</code>,

    and then the rest of the column is written plain. The best choice for data that repeats; it is the default.
  example: []
  syntax:
    content: Standard = 0
    return:
      type: ParquetNeo.DictionaryMode
- uid: ParquetNeo.DictionaryMode.Adaptive
  commentId: F:ParquetNeo.DictionaryMode.Adaptive
