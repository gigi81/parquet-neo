  source:
    remote:
      path: src/ParquetNeo.Enums/DictionaryMode.cs
      branch: docfx
      repo: https://github.com/gigi81/parquet-neo
    id: Adaptive
    path: ../src/ParquetNeo.Enums/DictionaryMode.cs
    startLine: 17
  assemblies:
  - ParquetNeo.Enums
  namespace: ParquetNeo
  summary: >-
    As <xref href="ParquetNeo.DictionaryMode.Standard" data-throw-if-not-resolved="false"></xref>, but the writer looks at the first values of the column (the first 32 KiB of them) and, when

    almost all of them (more than nine in ten) are different, such as identifiers, drops the dictionary and writes the rest of

    the column plain. That saves filling a dictionary that would be dropped anyway, which is much of the time of such a column,

    and the larger file. A column that repeats only after its first values has no dictionary.
  example: []
  syntax:
    content: Adaptive = 1
    return:
      type: ParquetNeo.DictionaryMode
