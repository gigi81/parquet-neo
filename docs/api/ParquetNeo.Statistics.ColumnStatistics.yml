  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Statistics
  summary: >-
    The statistics of one column chunk, decoded to .NET values. Obtain it from

    <xref href="ParquetNeo.RowGroupReader.GetStatistics(System.Int32)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    <xref href="ParquetNeo.Statistics.ColumnStatistics.Min" data-throw-if-not-resolved="false"></xref> and <xref href="ParquetNeo.Statistics.ColumnStatistics.Max" data-throw-if-not-resolved="false"></xref> are physical values: <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref>, <xref href="System.Int32" data-throw-if-not-resolved="false"></xref>, <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>,

    <xref href="System.Single" data-throw-if-not-resolved="false"></xref>, <xref href="System.Double" data-throw-if-not-resolved="false"></xref> or <code>byte[]</code> (BYTE_ARRAY and FIXED_LEN_BYTE_ARRAY), the same types the column

    is read as. They are ordered the way the column's type defines, which is not always the order of the .NET type:

    unsigned integer columns (UINT_8 to UINT_64) are stored in <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> and <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> but compare

    unsigned; strings and binary compare as unsigned bytes; decimals as big-endian two's complement numbers.

    </p>

    <p>

    They are bounds and may not be values in the column: when <xref href="ParquetNeo.Statistics.ColumnStatistics.IsMinExact" data-throw-if-not-resolved="false"></xref> or <xref href="ParquetNeo.Statistics.ColumnStatistics.IsMaxExact" data-throw-if-not-resolved="false"></xref> is not

    <code>true</code>, the bound may be shortened or rounded. A value is <code>null</code> when it was not recorded or cannot be trusted

    (for example the column order is unknown, or a floating-point bound is NaN).

    </p>
  example: []
  syntax:
    content: 'public sealed record ColumnStatistics : IEquatable<ColumnStatistics>'
    content.vb: Public NotInheritable Class ColumnStatistics Implements IEquatable(Of ColumnStatistics)
