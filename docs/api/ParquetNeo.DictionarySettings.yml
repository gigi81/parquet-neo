    id: SizeLimit
    path: ../src/ParquetNeo/DictionarySettings.cs
    startLine: 15
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    The size, in bytes, the dictionary of this column may reach before the writer stops adding to it and writes the rest of the

    column plain; see <xref href="ParquetNeo.ParquetWriterOptions.DictionaryPageSizeLimit" data-throw-if-not-resolved="false"></xref>, which is used when this is null. Raise it for a

    column with few distinct values that are large (long texts, urls), whose dictionary would otherwise be dropped half way

    through. Everything the dictionary and the pages that use it take is held in memory until the column is complete.
  example: []
  syntax:
    content: public int? SizeLimit { get; init; }
    parameters: []
    return:
      type: System.Nullable{System.Int32}
    content.vb: Public Property SizeLimit As Integer?
  overload: ParquetNeo.DictionarySettings.SizeLimit*
