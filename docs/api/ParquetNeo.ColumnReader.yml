    valid UTF-8 are a <xref href="ParquetNeo.Exceptions.ValueConversionException" data-throw-if-not-resolved="false"></xref>. Like <xref href="ParquetNeo.ColumnReader.ReadByteArrays(System.Span%7bSystem.ReadOnlyMemory%7bSystem.Byte%7d%7d%2cSystem.Span%7bSystem.Int32%7d%2cSystem.Span%7bSystem.Int32%7d)" data-throw-if-not-resolved="false"></xref>, a batch ends at the end of a

    page and may return fewer values than requested.
