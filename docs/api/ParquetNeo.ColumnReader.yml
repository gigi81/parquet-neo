    id: ColumnReader
    path: ../src/ParquetNeo/ColumnReader.Selection.cs
    startLine: 7
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo
  summary: >-
    Reads the values of one column chunk, a batch at a time. Obtain it from <xref href="ParquetNeo.RowGroupReader.OpenColumn(System.Int32)" data-throw-if-not-resolved="false"></xref>

    and dispose it when done, which returns its buffers to the pool.
  remarks: >-
    <p>

    A required column fills <code>values</code> and reads <code>values.Length</code> rows. An optional column also takes a

    <code>definitionLevels</code> span, whose length is the number of entries requested: it receives <code>0</code> for a null and

    <code>1</code> for a value, and <code>values</code> receives only the non-null values, packed at the start. Because any

    row may hold a value, <code>values</code> needs room for as many entries as there are rows requested. The result says

    how many rows and values were read; 0 rows means the chunk is exhausted.

    </p>

    <p>Pages are read one at a time, so memory stays bounded by the largest page. Not thread safe.</p>
  example: []
  syntax:
    content: 'public sealed class ColumnReader : IDisposable'
    content.vb: Public NotInheritable Class ColumnReader Implements IDisposable
