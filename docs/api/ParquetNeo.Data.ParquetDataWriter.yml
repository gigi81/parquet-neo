  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Data
  summary: >-
    Writes the rows of an <xref href="System.Data.IDataReader" data-throw-if-not-resolved="false"></xref> (a database query, a <xref href="System.Data.DataTable" data-throw-if-not-resolved="false"></xref> through

    <xref href="System.Data.DataTable.CreateDataReader" data-throw-if-not-resolved="false"></xref>, or any other reader) as a Parquet file. Each column of the reader becomes a column

    of the file, typed by <xref href="System.Data.IDataRecord.GetFieldType(System.Int32)" data-throw-if-not-resolved="false"></xref>: the types of <xref href="ParquetNeo.ColumnTypes.ColumnTypeRegistry" data-throw-if-not-resolved="false"></xref>, which

    are the ones <code>ParquetSerializer</code> writes. A column is optional unless the reader's schema table says

    <code>AllowDBNull</code> is false, and a decimal takes the precision and scale the schema table gives (38 and 18 otherwise).
  remarks: >-
    The rows go into row groups of <xref href="ParquetNeo.Data.ParquetDataWriterOptions.RowGroupSize" data-throw-if-not-resolved="false"></xref> rows, each encoded and written to the stream

    when it is full, so memory is bounded by one row group whatever the size of the result. Only the current result set is

    written, and neither the reader nor the stream is closed.
  example: []
