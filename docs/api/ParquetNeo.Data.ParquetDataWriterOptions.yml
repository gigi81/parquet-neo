    path: ../src/ParquetNeo/Data/ParquetDataWriterOptions.cs
    startLine: 21
  assemblies:
  - ParquetNeo
  namespace: ParquetNeo.Data
  summary: >-
    How many columns of a row group are encoded at the same time. The columns are independent, so encoding them on several

    threads makes a wide or compressed table faster, and the file is the same either way. Defaults to 1, which encodes on the

    calling thread; <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref> is a good value for a throughput-bound job.
  example: []
  syntax:
    content: public int MaxDegreeOfParallelism { get; init; }
