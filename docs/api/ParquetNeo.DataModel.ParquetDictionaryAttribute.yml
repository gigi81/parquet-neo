  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.DataModel
  summary: >-
    How the column of a property is dictionary encoded (every column of a collection or dictionary, but not of the properties of an

    object inside it, which have their own attributes), instead of <xref href="ParquetNeo.DictionaryMode.Standard" data-throw-if-not-resolved="false"></xref>. A dictionary stores each

    distinct value once and the rows refer to it, which pays off when values repeat and is wasted work when they do not.
  remarks: >-
    <p>

    Use <xref href="ParquetNeo.DictionaryMode.Adaptive" data-throw-if-not-resolved="false"></xref> on a property that is sometimes unique and sometimes repeated, depending on the data

    written, so that the writer drops the dictionary when the first values show it is of no use. Typical properties:

    a reference or order number (<code>"ORD-000123"</code>), a <xref href="System.Guid" data-throw-if-not-resolved="false"></xref> or a name that is nearly unique, a timestamp that is

    recorded to the millisecond, or a measurement such as a price, a temperature or a sensor reading.

    </p>

    <p>

    Use <xref href="ParquetNeo.DictionaryMode.Disabled" data-throw-if-not-resolved="false"></xref> on a property that is known to be unique, such as a primary key or an

    auto-incremented identifier, or whose values are never repeated by nature, such as a free text comment or a url. Nothing is lost,

    since a dictionary of unique values is larger than the values themselves.

    </p>

    <p>

    Leave it out (<xref href="ParquetNeo.DictionaryMode.Standard" data-throw-if-not-resolved="false"></xref>) for properties that take few distinct values: a country, a status, a

    currency, a category, a boolean-like flag stored as text, a date without a time, a small quantity.

    </p>

    <p>

    <xref href="ParquetNeo.DataModel.ParquetDictionaryAttribute.SizeLimit" data-throw-if-not-resolved="false"></xref> raises (or lowers) how big the dictionary of the column may grow before the writer gives it up, for

    a column with few distinct values that are large, such as long descriptions or urls that come again and again.

    </p>

    <p>What is set in the options (<xref href="ParquetNeo.ParquetWriterOptions.ColumnDictionaries" data-throw-if-not-resolved="false"></xref>) wins over this attribute.</p>
