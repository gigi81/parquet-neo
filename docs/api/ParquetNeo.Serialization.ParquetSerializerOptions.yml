    path: ../src/ParquetNeo.Serialization/ParquetSerializerOptions.cs
    startLine: 14
  assemblies:
  - ParquetNeo.Serialization
  namespace: ParquetNeo.Serialization
  summary: >-
    The number of rows in a row group. A group is encoded and written when it is full, so this is also how many rows the

    serializer holds in memory (as column values, not as objects) at a time. Larger groups compress better and give

    readers more to skip at once; smaller ones need less memory. Defaults to 100,000.
  example: []
  syntax:
    content: public int RowGroupSize { get; init; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property RowGroupSize As Integer
  overload: ParquetNeo.Serialization.ParquetSerializerOptions.RowGroupSize*
